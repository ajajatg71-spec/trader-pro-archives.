name: Trader Pro R113 - PostgreSQL integration and backup/restore

on:
  workflow_dispatch:
  push:
    branches:
      - ci/postgres-r113-validation

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trader_pro
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: trader_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader_pro -d trader_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRADER_PRO_TEST_DATABASE_URL: postgresql+psycopg://trader_pro:ci_only_password@127.0.0.1:5432/trader_pro_test
      TRADER_PRO_TEST_DATABASE_DISPOSABLE: "YES"
      TRADER_PRO_RESTORE_DATABASE_URL: postgresql+psycopg://trader_pro:ci_only_password@127.0.0.1:5432/trader_pro_restore
      PGPASSWORD: ci_only_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare R113 source from archived baseline and overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trader-pro-r113"
          unzip -q "$GITHUB_WORKSPACE/Trader-Pro-2.0-R99-neon-cloud-preflight-2026-11-26.zip" -d "$RUNNER_TEMP/trader-pro-r113"
          base64 --decode "$GITHUB_WORKSPACE/ci/Trader-Pro-R113-CI-overlay-2026-11-26.zip.b64" > "$RUNNER_TEMP/r113-overlay.zip"
          unzip -oq "$RUNNER_TEMP/r113-overlay.zip" -d "$RUNNER_TEMP/trader-pro-r113"
          test -f "$RUNNER_TEMP/trader-pro-r113/scripts/verify_postgres.sh"
          test -f "$RUNNER_TEMP/trader-pro-r113/tests/test_postgres_integration.py"
          echo "TRADER_PRO_SOURCE=$RUNNER_TEMP/trader-pro-r113" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$TRADER_PRO_SOURCE/requirements-dev.txt"

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL and create empty restore database
        run: |
          for attempt in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U trader_pro -d trader_pro_test && break
            sleep 2
          done
          createdb --host=127.0.0.1 --port=5432 --username=trader_pro trader_pro_restore

      - name: Execute atomic backup script against disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRADER_PRO_SOURCE"
          mkdir -p "$RUNNER_TEMP/r113-backups"
          DATABASE_URL="$TRADER_PRO_TEST_DATABASE_URL" BACKUP_DIR="$RUNNER_TEMP/r113-backups" bash scripts/backup_postgres.sh | tee "$GITHUB_WORKSPACE/postgres-r113-backup.log"
          backup_file="$(find "$RUNNER_TEMP/r113-backups" -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$backup_file"
          (cd "$(dirname "$backup_file")" && sha256sum -c "$(basename "$backup_file").sha256")
          pg_restore --list "$backup_file" >/dev/null

      - name: Run Alembic, PostgreSQL integration, backup, restore and content verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRADER_PRO_SOURCE"
          bash scripts/verify_postgres.sh 2>&1 | tee "$GITHUB_WORKSPACE/postgres-r113-validation.log"

      - name: Run complete Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRADER_PRO_SOURCE"
          python -m pytest -q
          python -m unittest discover -q
          python -m compileall -q .

      - name: Upload PostgreSQL validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-pro-r113-postgres-validation
          path: |
            postgres-r113-validation.log
            postgres-r113-backup.log
          if-no-files-found: warn
          retention-days: 14
