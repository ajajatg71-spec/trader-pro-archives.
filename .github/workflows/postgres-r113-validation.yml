name: Trader Pro - PostgreSQL integration and backup/restore

on:
  workflow_dispatch:
    inputs:
      apply_r113_overlay:
        description: "Apply the verified R113 overlay (false = validate archived R99 baseline only)"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - ci/postgres-r113-validation
    paths:
      - ci/R113-CI-READY

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trader_pro
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: trader_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader_pro -d trader_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRADER_PRO_TEST_DATABASE_URL: postgresql+psycopg://trader_pro:ci_only_password@127.0.0.1:5432/trader_pro_test
      TRADER_PRO_TEST_DATABASE_DISPOSABLE: "YES"
      TRADER_PRO_RESTORE_DATABASE_URL: postgresql+psycopg://trader_pro:ci_only_password@127.0.0.1:5432/trader_pro_restore
      PGPASSWORD: ci_only_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify R99 archive, reconstruct R113 overlay and apply test fixes
        shell: bash
        env:
          APPLY_R113_OVERLAY: ${{ inputs.apply_r113_overlay || (github.event_name == 'push') }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/Trader-Pro-2.0-R99-neon-cloud-preflight-2026-11-26.zip"
          echo "0c7fd14d173db29080786a8397ef736584ab9792d273a4ff677ddc6844a3740d  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trader-pro-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/trader-pro-source"
          if [[ "$APPLY_R113_OVERLAY" == "true" ]]; then
            cat "$GITHUB_WORKSPACE"/ci/overlay-r113/part-*.b64 | base64 --decode > "$RUNNER_TEMP/r113-overlay.tar.xz"
            echo "fe40bf6be7c81faca3d0eecf5fecf0de6cdc2eae0c6d7651074182c38992c77f  $RUNNER_TEMP/r113-overlay.tar.xz" | sha256sum -c -
            xz -t "$RUNNER_TEMP/r113-overlay.tar.xz"
            tar -xJf "$RUNNER_TEMP/r113-overlay.tar.xz" -C "$RUNNER_TEMP/trader-pro-source"
          fi
          patch --directory="$RUNNER_TEMP/trader-pro-source" --strip=1
          test -f "$RUNNER_TEMP/trader-pro-source/alembic.ini"
          test -f "$RUNNER_TEMP/trader-pro-source/scripts/verify_postgres.sh"
          test -f "$RUNNER_TEMP/trader-pro-source/tests/test_postgres_integration.py"
          echo "TRADER_PRO_SOURCE=$RUNNER_TEMP/trader-pro-source" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$TRADER_PRO_SOURCE/requirements-dev.txt"

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL and create empty restore database
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U trader_pro -d trader_pro_test && break
            sleep 2
          done
          createdb --host=127.0.0.1 --port=5432 --username=trader_pro trader_pro_restore

      - name: Run Alembic, PostgreSQL integration, backup, restore and content verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRADER_PRO_SOURCE"
          bash scripts/verify_postgres.sh 2>&1 | tee "$GITHUB_WORKSPACE/postgres-r113-validation.log"

      - name: Run complete Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRADER_PRO_SOURCE"
          python -m pytest -q
          python -m unittest discover -q
          python -m compileall -q .

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-pro-postgres-validation
          path: |
            postgres-r113-validation.log
            postgres-backup.log
          if-no-files-found: warn
          retention-days: 14
